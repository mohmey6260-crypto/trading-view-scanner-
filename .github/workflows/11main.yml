name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No project ZIP found"
            exit 1
          fi

          mkdir -p project

          unzip -q "$ZIP" -d project

          echo "Project extracted successfully."

          echo "Project files:"
          find project -maxdepth 3 -type f

      - name: Build APK
        run: |
          PROJECT_DIR="project/TradingViewScanner"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle was not found"
            echo "Searching for settings.gradle..."
            find project -name settings.gradle -type f
            exit 1
          fi

          echo "Building project from:"
          echo "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradingViewScanner-APK
          path: project/TradingViewScanner/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
